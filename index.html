<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>롤 챔피언 가이드</title>
<style>
  :root{--bg:#0a1428;--panel:#0f1f3d;--panel2:#142a52;--gold:#c8aa6e;--text:#e8e6df;--mute:#9aa7bd;--blue:#0ac8b9;--red:#e84057}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic",system-ui,sans-serif;line-height:1.6}
  header{padding:24px 16px 12px;text-align:center;border-bottom:1px solid #2a3a5e}
  h1{margin:0;color:var(--gold);letter-spacing:1px;font-size:1.8rem}
  header p{margin:4px 0 0;color:var(--mute);font-size:.9rem}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  input[type=search]{flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:1px solid #2a3a5e;background:var(--panel);color:var(--text);font-size:1rem}
  .chip{padding:8px 14px;border-radius:20px;border:1px solid #2a3a5e;background:var(--panel);color:var(--text);cursor:pointer;font-size:.9rem}
  .chip.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:bold}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .grp{margin-bottom:8px}
  .grp h2{color:var(--gold);font-size:1.15rem;margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid #2a3a5e}
  .grp h2 small{color:var(--mute);font-weight:normal;font-size:.85rem;margin-left:6px}
  .card{background:var(--panel);border:1px solid #2a3a5e;border-radius:10px;padding:14px;cursor:pointer;text-align:center;transition:.15s}
  .card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .avatar{position:relative;overflow:hidden;width:88px;height:88px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:bold;color:#fff;border:2px solid var(--gold)}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
  .card b{display:block}
  .card small{color:var(--mute)}
  .empty{color:var(--mute);text-align:center;padding:40px}
  /* detail */
  #detail{display:none}
  .back{background:none;border:1px solid var(--gold);color:var(--gold);padding:6px 14px;border-radius:6px;cursor:pointer;margin-bottom:12px}
  .head{display:flex;gap:16px;align-items:center;margin-bottom:16px}
  .head .avatar{width:110px;height:110px;font-size:2.4rem;margin:0;flex:0 0 110px}
  .head h2{margin:0;color:var(--gold)}
  .tag{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--panel2);font-size:.8rem;margin:4px 4px 0 0;color:var(--blue)}
  section{background:var(--panel);border:1px solid #2a3a5e;border-radius:10px;padding:14px 16px;margin-bottom:14px}
  section h3{margin:0 0 10px;color:var(--gold);font-size:1.05rem}
  .skill{display:flex;gap:12px;padding:8px 0;border-top:1px solid #1d2f55}
  .skill:first-of-type{border-top:0}
  .key{flex:0 0 34px;height:34px;border-radius:6px;background:var(--panel2);border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:bold}
  .skill b{color:var(--text)}
  .skill p{margin:2px 0 0;color:var(--mute);font-size:.92rem}
  .combo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
  .combo span.k{background:var(--panel2);border:1px solid var(--gold);color:var(--gold);padding:2px 10px;border-radius:6px;font-weight:bold}
  .combo i{color:var(--mute);font-style:normal}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.two{grid-template-columns:1fr}}
  .cn{display:inline-block;margin:3px 4px 3px 0;padding:4px 12px;border-radius:14px;cursor:pointer;font-size:.9rem;border:1px solid}
  .weak .cn{color:var(--red);border-color:var(--red)}
  .strong .cn{color:var(--blue);border-color:var(--blue)}
  ul{margin:0;padding-left:20px;color:var(--mute)}
  .reason{color:var(--mute);font-size:.88rem;margin:6px 0 0}

  /* 탭 + 바텀 듀오 */
  .tabs{display:flex;justify-content:center;gap:8px;margin-top:12px}
  .tab{padding:8px 20px;border-radius:20px;border:1px solid var(--gold);background:none;color:var(--gold);cursor:pointer;font-size:.95rem}
  .tab.on{background:var(--gold);color:#1a1a1a;font-weight:bold}
  .duo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .duo{background:var(--panel);border:1px solid #2a3a5e;border-radius:10px;padding:14px 16px}
  .duo h3{margin:0 0 6px;font-size:1.1rem;color:var(--text)}
  .duo h3 a{color:var(--gold);cursor:pointer;text-decoration:underline dotted}
  .duo h3 span{color:var(--mute);margin:0 6px}
  .ttag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.78rem;margin-bottom:8px;font-weight:bold}
  .t-올인{background:#5a1f2a;color:#ff8a9a}.t-포킹{background:#1f4a5a;color:#7fe0f0}.t-보호{background:#2a4a2a;color:#9be09b}.t-전용{background:#4a3a1a;color:#ffd27a}
  .duo dl{margin:0}.duo dt{color:var(--gold);font-size:.85rem;margin-top:8px}.duo dd{margin:2px 0 0;color:var(--mute);font-size:.92rem}
  .duo ul{margin:2px 0 0;padding-left:18px}
  .sit{background:var(--panel);border:1px solid #2a3a5e;border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;margin-bottom:10px}
  .sit b{color:var(--text)}.sit p{margin:4px 0 6px;color:var(--mute);font-size:.92rem}
  .pick{display:inline-block;margin:2px 4px 2px 0;padding:3px 12px;border-radius:14px;background:var(--panel2);color:var(--blue);font-size:.88rem}
  h2.sec{color:var(--gold);margin:22px 0 10px;font-size:1.2rem}

  /* 시기별 강함 */
  .power-svg{width:100%;max-width:520px;height:auto;display:block}
  .pbadge{display:inline-block;padding:3px 12px;border-radius:12px;font-weight:bold;font-size:.85rem;margin-bottom:8px}
  .pb-초반{background:#5a1f2a;color:#ff8a9a}.pb-후반{background:#1f4a5a;color:#7fe0f0}.pb-고른{background:#2a4a2a;color:#9be09b}
  .prow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.9rem}
  .prow .lb{flex:0 0 38px;color:var(--gold);font-weight:bold}
  .pips{display:flex;gap:4px}
  .pip{width:30px;height:10px;border-radius:3px;background:#1d2f55}
  .pip.on{background:var(--blue)}
  .prow .nm{color:var(--mute);font-size:.82rem}
  .mini-wrap{margin-top:6px}
  .ml,.mini{display:flex;justify-content:center;gap:6px}
  .ml span{width:16px;text-align:center;font-size:.68rem;font-weight:bold;color:var(--mute)}
  .ml span:nth-child(1){color:#ff8a9a}.ml span:nth-child(2){color:var(--blue)}.ml span:nth-child(3){color:var(--gold)}
  .mini{align-items:flex-end;height:22px}
  .mini i{display:block;width:16px;border-radius:2px 2px 0 0;background:var(--blue);opacity:.85}
  .bline{margin-top:6px;font-size:.72rem;color:#ffb36b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .burst{border-color:#8a4a2a;background:linear-gradient(180deg,#2a1a1a 0,var(--panel) 60%)}
  .burst h3{color:#ffb36b}
  .bsteps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
  .bsteps .k{background:#3a1f14;border:1px solid #ff8a4a;color:#ffd0a8;padding:4px 12px;border-radius:6px;font-weight:bold}
  .bsteps .k.aa{background:#1d2f55;border-color:#6b7fa8;color:#cdd8ee;font-weight:normal}
  .bsteps i{color:var(--mute);font-style:normal}
  .bsteps .n{width:20px;height:20px;border-radius:50%;background:#ff8a4a;color:#1a1a1a;font-size:.72rem;font-weight:bold;display:inline-flex;align-items:center;justify-content:center;margin-right:-2px}
  .mini i:nth-child(1){background:#ff8a9a}.mini i:nth-child(3){background:var(--gold)}
  .plegend{color:var(--mute);font-size:.8rem;margin:8px 0 0}

  .syn .duo{background:var(--panel2)}
  .syn .duo-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .ehelp{color:var(--mute);font-size:.9rem;margin:0 0 10px}
  .egroup{margin-bottom:14px}
  .egroup h3{margin:0 0 8px;color:var(--text);font-size:1rem}
  .eopts{display:flex;flex-wrap:wrap;gap:8px}
  .eopt{padding:8px 14px;border-radius:10px;border:1px solid #2a3a5e;background:var(--panel);color:var(--text);cursor:pointer;text-align:left;font-size:.9rem}
  .eopt small{display:block;color:var(--mute);font-size:.75rem;margin-top:2px}
  .eopt.on{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold) inset}
  .res{background:var(--panel);border:1px solid #2a3a5e;border-radius:10px;padding:12px 16px;margin-bottom:10px}
  .res.good{border-left:4px solid var(--blue)}.res.bad{border-left:4px solid var(--red)}
  .res h4{margin:0 0 4px;font-size:1.05rem}
  .res h4 a{color:var(--gold);cursor:pointer;text-decoration:underline dotted}
  .rb{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.78rem;font-weight:bold;margin-left:8px}
  .rb.s{background:#1f4a5a;color:#7fe0f0}.rb.m{background:#2a4a2a;color:#9be09b}.rb.x{background:#5a1f2a;color:#ff8a9a}
  .res ul{margin:4px 0 0;padding-left:18px;color:var(--mute);font-size:.9rem}
  .res li b{color:var(--gold)}
  .res .plan{margin:6px 0 0;color:var(--mute);font-size:.88rem}

  .pt{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:10px;font-size:.68rem;font-weight:bold}
  .pt.buff{background:#1f4a2a;color:#8be09b}.pt.nerf{background:#5a1f2a;color:#ff8a9a}.pt.adj{background:#4a3a1a;color:#ffd27a}.pt.fix{background:#2a3550;color:#9fb4de}
  .prow2{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #1d2f55;font-size:.92rem}
  .prow2:first-of-type{border-top:0}
  .prow2 .pv{flex:0 0 52px;color:var(--gold);font-weight:bold}
  .prow2 p{margin:0;color:var(--mute)}
  .pbase{background:var(--panel);border:1px solid #2a3a5e;border-left:4px solid var(--gold);border-radius:8px;padding:10px 16px;margin-bottom:14px;color:var(--mute);font-size:.9rem}
  .pbase b{color:var(--gold)}

  .avd{background:var(--panel);border:1px solid #2a3a5e;border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .avd h3{margin:0 0 4px;color:var(--gold);font-size:1.05rem}
  .avd .sub{color:var(--mute);font-size:.82rem;margin:0 0 8px}
  .avi{border-left:4px solid var(--red);background:var(--panel2);border-radius:8px;padding:8px 12px;margin-bottom:8px}
  .avi b{color:#ff8a9a}
  .avi .tp{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:#1d2f55;color:var(--mute);font-size:.72rem}
  .avi p{margin:3px 0 0;color:var(--mute);font-size:.9rem}
  .avi .vs{margin-top:4px;font-size:.85rem;color:var(--blue)}

  .stags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .stag{padding:1px 8px;border-radius:10px;background:#1d2f55;color:#9fb4de;font-size:.72rem}
  .stag.cc{background:#4a1f2a;color:#ff9aa8;font-weight:bold}
  .skill p{line-height:1.55}
</style>
</head>
<body>
<header>
  <h1>⚔ 롤 챔피언 가이드</h1>
  <p>스킬 설명 · 콤보 · 시너지 바텀 듀오 · 상대 조합 대응 · 최근 패치</p>
  <div class="tabs">
    <button class="tab on" data-t="list">챔피언</button>
    <button class="tab" data-t="duo">상대 조합 대응</button>
    <button class="tab" data-t="patch">최근 패치</button>
  </div>
</header>

<div class="wrap">
  <div id="list">
    <div class="controls">
      <input type="search" id="q" placeholder="챔피언 이름 검색 (예: 아리, Ahri)">
      <div id="roles" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div id="grid"></div>
  </div>
  <div id="detail"></div>
  <div id="duo" style="display:none"></div>
  <div id="patch" style="display:none"></div>
</div>

<script>
/* ===== 챔피언 데이터 =====
   새 챔피언을 추가하려면 아래 배열에 같은 형식으로 객체를 하나 더 넣으면 됩니다.
   (스킬 이름·수치는 패치로 바뀔 수 있으니 최신 패치 노트를 함께 확인하세요.) */
const CHAMPIONS = [
/* ================= 원딜 ================= */
{
  id:"jinx", name:"징크스", en:"Jinx", title:"난폭한 말괄량이", role:"원딜", diff:"보통", color:"#4ab3d9",
  desc:"킬/어시스트 후 폭발적으로 강해지는 후반형 원거리 딜러. 글로벌 궁극기로 전투를 마무리합니다.",
  skills:[
    ["P","흥분 상태!","적 챔피언/구조물 처치 보조 시 이동·공격 속도가 크게 증가합니다."],
    ["Q","변환!","미니건(공속 증가)과 로켓 런처(범위 피해·사거리 증가)를 전환합니다."],
    ["W","잽!","전기 탄환을 발사해 피해를 주고 적을 둔화시킵니다."],
    ["E","씹어먹는 폭죽!","폭죽을 설치해 밟은 적을 잠시 속박합니다."],
    ["R","초강력 슈퍼 메가 죽음의 로켓!","전 맵 사거리의 로켓. 대상의 잃은 체력에 비례해 피해량이 증가합니다."]
  ],
  combos:[["E","W","Q","평타"],["W","E","평타","R"]],
  comboNote:"덫과 둔화로 붙지 못하게 하고, 킬 후 '흥분 상태'를 이용해 연속 처치하세요.",
  weak:["제드","레오나","블리츠크랭크","카직스"], strong:["탐 켄치","잔나","룰루"],
  reason:"이동기가 없고 체력이 약해 암살자/강한 인게이지에 취약하지만, 보호해주는 서포터와는 시너지가 좋습니다.",
  tips:["초반 라인전은 안전하게, 한타 순서를 잘 조절","대형 오브젝트 전 로켓 궁으로 마무리","E는 벽 쪽에서 적에게 설치"]
},
{
  id:"ashe", name:"애쉬", en:"Ashe", title:"얼음 화살", role:"원딜", diff:"쉬움", color:"#6ec4e8",
  desc:"둔화와 글로벌 스턴으로 맵 전체를 지배하는 원거리 딜러. 시야와 CC 연계에 강합니다.",
  skills:[
    ["P","냉기 화살","평타로 적을 둔화시키고, 크리티컬 시 추가 피해를 줍니다."],
    ["Q","집중 사격","공격 속도가 증가하고 평타가 연속 화살을 발사합니다."],
    ["W","일제 사격","부채꼴로 화살을 발사해 피해와 둔화를 줍니다."],
    ["E","매의 눈","맵 위 지정 지점을 정찰하며 시야를 제공합니다."],
    ["R","마법의 수정 화살","글로벌 사거리로 첫 챔피언을 기절시키고 피해를 줍니다."]
  ],
  combos:[["W","Q","평타"],["R","W","Q","평타"]],
  comboNote:"궁극기로 기절시키고 W/Q로 딜을 이어가세요.",
  weak:["드레이븐","루시안","레오나","파이크"], strong:["케이틀린","미스 포츈","카이사"],
  reason:"적의 인게이지/암살형 챔피언에게 약하며 초반 라인전에서 공격적인 원딜에게 밀릴 수 있습니다.",
  tips:["궁극기는 미니맵을 보고 갱 지원 + 이니시","E로 정글 시야 확보","슬로우 덕분에 카이팅이 쉽다"]
},
{
  id:"ezreal", name:"이즈리얼", en:"Ezreal", title:"탐험가", role:"원딜", diff:"보통", color:"#e0b84a",
  desc:"안정적인 원거리 포킹과 순간이동 회피로 생존하는 마법 원딜입니다.",
  skills:[
    ["P","상승하는 주문력","스킬 적중 시 공격 속도가 오릅니다."],
    ["Q","신비한 화살","직선 투사체. 적중 시 모든 스킬 쿨타임이 감소합니다."],
    ["W","정수 흐름","표식을 남기고 평타/스킬로 터뜨려 추가 피해를 줍니다."],
    ["E","비전 이동","짧게 순간이동하며 근처 적에게 마법 피해를 줍니다."],
    ["R","정조준 일격","맵 전체로 날아가는 대형 화살."]
  ],
  combos:[["W","Q","E","Q"],["R","W","Q"]],
  comboNote:"W 표식을 먼저 걸고 Q로 터뜨리면 쿨타임이 크게 줄어듭니다.",
  weak:["제드","카사딘","피즈","블리츠크랭크"], strong:["케이틀린","시비르","베인"],
  reason:"기동성으로 암살자 하나는 회피하지만, 강한 CC나 연속 돌진에는 불리합니다.",
  tips:["Q 적중이 곧 실력","E는 항상 도주용으로 남기기","후반엔 포킹과 궁극기 활용"]
},
{
  id:"caitlyn", name:"케이틀린", en:"Caitlyn", title:"필트오버의 보안관", role:"원딜", diff:"보통", color:"#5a8fc7",
  desc:"기본 공격 사거리가 길어 라인전 압박에 강한 원딜. 덫과 그물로 상대를 묶고 헤드샷을 노립니다.",
  skills:[
    ["P","헤드샷","일정 횟수마다 평타가 추가 피해를 주며, 덫/그물에 걸린 적에게도 헤드샷이 적용됩니다."],
    ["Q","필트오버 피스메이커","긴 사거리의 관통 사격을 합니다."],

  ["Q","춤추는 수류탄","대상에게 수류탄을 던지면 주변 적에게 최대 3번 더 튕깁니다. 튕기기 전에 처치된 적이 있으면 피해가 35%씩 증가합니다.",["대상 지정","튕김"]],
  ["W","죽음의 꽃","긴 직선 저격으로 첫 챔피언에서 멈춥니다. 진·아군에게 피해를 입었거나 덫을 밟은 챔피언은 표식(4초)이 걸리고, 표식 대상에게 맞으면 1.25~2.25초 속박됩니다.",["속박","스킬샷","긴 사거리"]],
  ["E","관객 모집","은신 덫을 설치합니다(최대 2충전). 적이 밟으면 4초간 노출시키고 35% 둔화(2초) 후 폭발합니다. 진이 적 챔피언을 처치하면 그 자리에 무료 덫이 생깁니다.",["둔화 35%","설치형","노출"]],
  ["R","커튼콜","최대 10초 동안 대포로 변신해 최대 4번 재시전 사격합니다. 맞은 챔피언을 80% 둔화시키고 노출시키며 4번째 탄은 치명타입니다.",["둔화","4연발","저격"]]],
 lucian:[
  ["P","빛의 총잡이","스킬을 쓰면 다음 평타가 0.25초 간격으로 두 번 나갑니다(같은 대상 또는 다른 대상). 아군에게 보호막/회복을 받거나 근처 적이 속박되면 강화탄(Vigilance)이 쌓입니다.",["2연발","강화탄"]],
  ["Q","꿰뚫는 빛","지정한 적 방향으로 직선 관통 레이저를 쏩니다. 시전 중에는 방향이 바뀌지 않아 옆으로 빠지면 피할 수 있습니다.",["관통","스킬샷"]],
  ["W","불타는 열정","십자 모양으로 폭발하는 투사체입니다. 적중한 적에게 6초 표식을 남기고, 표식 대상에게 피해를 주면 이동 속도가 오릅니다.",["표식","이동속도"]],
  ["E","끈질긴 추격","지정 방향으로 짧게 돌진합니다. 돌진 중에도 스킬을 쓸 수 있고 평타 타이머가 초기화되며, 빛의 총잡이가 적중할 때마다 쿨타임이 줄어듭니다(챔피언 대상은 2초).",["돌진","쿨타임 감소"]],
  ["R","단죄","최대 3초 채널링하며 최대 22발을 난사합니다. 유체화 상태로 이동할 수 있고 재시전하면 종료됩니다. 침묵·기절 등 방해에 끊깁니다.",["채널링","유체화","방해받으면 취소"]]],
 draven:[
  ["P","드레이븐의 리그","도끼를 받거나 미니언·몬스터·포탑을 처치하면 명성이 쌓입니다. 챔피언을 처치하면 명성을 소모해 추가 골드를 얻고, 죽으면 명성의 절반을 잃습니다.",["명성","골드"]],
  ["Q","회전 도끼","5.8초 안에 다음 평타가 도끼를 던져 추가 피해를 줍니다. 도끼는 높이 튀었다가 착지하며, 받으면 다시 강화 평타를 쓸 수 있습니다(최대 도끼 2개).",["평타 강화","도끼 받기"]],
  ["W","피의 질주","공속이 오르고 이동 속도가 크게 올랐다가 줄어들며 1.5초 유체화됩니다. 회전 도끼를 받으면 쿨타임이 초기화됩니다.",["이동속도","공속","쿨타임 초기화"]],
  ["E","비켜라!","직선으로 도끼를 던져 맞은 적을 옆으로 밀치고 2초간 둔화시킵니다.",["넉백","둔화","스킬샷"]],
  ["R","죽음의 회전","전 맵 사거리로 거대한 도끼 2개를 던지며, 재시전하면 도끼가 되돌아옵니다. 현재 명성 수치 이하 체력의 챔피언은 처형됩니다.",["글로벌","스킬샷","처형"]]],
 xayah:[
  ["P","깔끔한 일격","스킬을 쓸 때마다 3스택(최대 5, 8초)을 얻고, 평타마다 1스택을 써서 깃털을 날립니다(관통). 사거리 끝에 닿은 깃털은 6초 동안 땅에 박힙니다.",["깃털","관통"]],
  ["Q","쌍칼","직선으로 단검 두 개를 던집니다. 첫 대상 이후에 맞은 적은 감소된 피해를 받으며, 깃털을 남깁니다.",["스킬샷","깃털 남김"]],
  ["W","치명적인 깃털","공속이 오르고 평타에 소형 깃털이 추가로 나갑니다. 챔피언에게 맞히면 이동 속도가 오르며, 근처에 라칸이 있으면 라칸도 같이 강화됩니다.",["공속","이동속도"]],
  ["E","칼날 부르기","땅에 박힌 모든 깃털을 자신에게 불러들이며 피해를 줍니다. 깃털 3개 이상에 맞은 적은 1.25초 속박됩니다(박힌 깃털이 1개 이상 필요).",["속박 1.25초","전 맵 깃털"]],
  ["R","깃털 폭풍","도약해 1.5초 동안 대상 지정 불가·유체화가 되고, 이후 원뿔 방향으로 깃털 5개를 쏩니다. 시전 중에는 평타와 다른 스킬을 쓸 수 없습니다.",["대상 지정 불가","원뿔"]]],
 samira:[
  ["P","저돌적인 충동","다른 챔피언을 연속으로 타격하면 스타일 스택(최대 6, 6초)이 쌓여 이동 속도가 오릅니다. 속박된 적에게는 평타가 6연발로 강화되고 필요하면 돌진해 붙습니다. 최대 스택이 있어야 궁극기를 쓸 수 있습니다.",["스타일 스택","CC 연계"]],
  ["Q","재주","직선 사격이며, 코앞에 적이 있으면 근접 베기로 바뀝니다. 돌진 중에 쓰면 이동 경로에 폭발물을 남깁니다.",["스킬샷","근접 변형"]],
  ["W","칼날 선풍","주변을 베어 적의 투사체를 파괴합니다. 시전 중 이동은 가능하지만 평타와 Q는 쓸 수 없습니다.",["투사체 차단"]],
  ["E","야생의 질주","적이나 구조물을 향해 돌진하며(유닛 통과), 공속이 잠시 오릅니다. 챔피언 처치에 관여하면 쿨타임이 초기화됩니다.",["돌진","쿨타임 초기화"]],
  ["R","불타는 방아쇠","스타일 최대 스택일 때 사용합니다. 주변 적에게 연속 사격(치명타·흡혈 적용)을 하며, 시전 중에는 평타·Q·W를 쓸 수 없고 방해에 끊깁니다.",["채널링","광역","스택 필요"]]],
 yunara:[
  ["P","Vow of the First Lands","치명타가 마법 추가 피해를 입히며(AP 계수), 이 추가 피해에도 흡혈이 적용됩니다.",["치명타 마법 피해"]],
  ["Q","Cultivation of Spirit","평타에 마법 추가 피해가 붙고, 공격할수록 '해방' 중첩이 쌓입니다(최대 8, 챔피언 공격은 2씩, 6초). 발동하면 5초간 공속·추가 피해가 오르고 평타가 대상 주변 적에게 퍼지며 평타 타이머가 초기화됩니다. 초월 상태에서는 자동으로 발동합니다.",["공속","범위 평타","중첩 소모"]],
  ["W","Arc of Judgment","회전하는 염주를 던져 처음 맞은 적을 크게 둔화시키고(점차 감소) 피해를 줍니다. 최대 사거리에서 1초 동안 머물며 주변을 때리고 미니언은 처형할 수 있습니다. 초월 상태에서는 Arc of Ruin(둔화 광선)으로 바뀝니다.",["둔화","스킬샷","시야 제공"]],
  ["E","Kanmei's Steps","돌진기가 아니라 1.5초 동안 유체화와 이동 속도를 얻는 버프입니다(적 챔피언을 바라볼 때 더 강함). 초월 상태에서는 Untouchable Shadow(지정 방향 돌진)로 바뀝니다.",["이동속도","유체화","초월 시 돌진"]],
  ["R","Transcend One's Self","15초 동안 초월 상태가 되어 Q가 자동 발동하고 W는 광선, E는 돌진으로 강화됩니다. (요약 정보 기준: W 쿨타임이 크게 줄고 E 쿨타임이 초기화됨)",["초월","스킬 강화","자기 대상"]]],
 azir:[
  ["P","슈리마의 유산","파괴된 포탑 잔해에서 태양 원반을 소환합니다(0.5초 시전, 5초 조립). 완성되면 내부 포탑 역할을 하며 45초 후 사라지고, 아지르 AP에 따라 공격력이 늘어납니다.",["포탑 소환"]],
  ["Q","정복자의 모래","모든 모래 병사가 지정 위치로 돌격해 지나간 적에게 피해를 주고 25%(1초) 둔화시킵니다. 병사가 있어야 쓸 수 있으며, 여러 병사가 같은 적을 맞혀도 피해와 둔화는 한 번만 적용됩니다.",["둔화","스킬샷"]],
  ["W","솟아라!","지정 위치에 모래 병사를 소환합니다(10초 유지, 충전식 최대 2). 아지르가 적에게 평타를 명령하면 병사 사거리 안의 적을 병사가 직선으로 공격합니다. 적 포탑 사거리 안에서는 병사가 두 배로 빨리 사라집니다.",["병사 소환","직선 공격"]],
  ["E","모래 이동","가장 가까운 모래 병사에게 돌진하며 경로의 적에게 피해를 주고 1.5초 방어막을 얻습니다. 챔피언을 맞히면 멈추고 솟아라! 충전을 얻습니다. 돌진 중에도 다른 스킬을 쓸 수 있습니다.",["돌진","방어막 1.5초"]],
  ["R","황제의 분할","아지르 뒤쪽 병사 방진이 앞으로 돌진해 적을 앞으로 밀쳐내며(공중), 이후 병사가 벽이 되어 적은 지나갈 수 없고 아군은 통과합니다.",["넉백","벽","스킬샷"]]],
 aurora:[
  ["P","Spirit Abjuration","평타와 스킬이 적에게 표식을 쌓아(최대 3, 4초) 3중첩이 되면 최대 체력 비례 마법 피해로 터집니다. 챔피언이 대상이면 영혼이 풀려나 오로라를 따라다니며 초당 체력을 회복시킵니다(영혼 최대 4).",["표식 3중첩","회복"]],
  ["Q","Twofold Hex","저주 볼트를 날려 적을 표식(3.5초)합니다. 재시전하면(자동 재시전 포함) 표식을 모두 소모하며 저주를 되돌려 경로상의 적에게 잃은 체력 비례 피해를 줍니다.",["표식","스킬샷","재시전"]],
  ["W","Across the Veil","영혼 포털을 통해 지정 방향으로 도약해 잠시(약 1~1.6초) 은신하고 이후 4초간 유체화와 이동 속도를 얻습니다. 챔피언 처치에 관여하면 쿨타임이 초기화됩니다. 도약 중에는 다른 행동을 할 수 없습니다.",["돌진","은신","쿨타임 초기화"]],
  ["E","The Weirding","직선으로 에너지를 쏴 적에게 피해와 80% 둔화(약 1초)를 주고, 오로라는 뒤로 밀려납니다(속박 중에는 밀리지 않음).",["둔화 80%","후퇴 이동","스킬샷"]],
  ["R","Between Worlds","앞으로 도약하며 충격파를 일으켜 적에게 피해와 30% 둔화(2초)를 줍니다. 영혼 세계로 이어지는 균열이 남아, 오로라가 경계를 닿으면 반대편으로 순간 이동하고, 적이 닿으면 둔화됩니다. 재시전하면 균열이 닫힙니다.",["둔화","돌진","균열 이동"]]],
 taliyah:[
  ["P","돌 서핑","지형 근처에서 이동 속도가 오릅니다. 전투나 스킬 시전 직후에는 잠시 효과가 멈춥니다.",["이동속도"]],
  ["Q","실타래 연발","돌 파편 5발을 1.5초에 걸쳐 쏩니다. 파편이 맞은 적에게 시야를 줍니다. 시전하면 발밑에 '작업된 땅'이 생기고, 그 위에서 다시 쓰면 마나 10·쿨타임 절반의 강화 Q(거대 바위)가 나가 맞은 적을 1.5초 둔화시킵니다(몬스터는 3초 기절).",["둔화(강화 Q)","땅 생성","스킬샷"]],
  ["W","지진 밀치기","위치와 방향을 지정합니다. 약 0.8초 뒤 땅이 솟아 적을 띄워 지정 방향으로 밀어냅니다(공중).",["띄우기","밀어내기","벡터 스킬샷"]],
  ["E","풀려난 대지","전방 부채꼴로 돌 22개를 뿌려 피해를 주고 4초 동안 남겨 안의 적을 20% 둔화시킵니다. 적이 돌 위로 돌진하거나 띄워진 채 이동하면 돌이 폭발해 0.75초 기절시킵니다(몬스터는 2초). 시전 자체에는 기절이 없습니다.",["기절 0.75초(돌진/띄워졌을 때)","둔화 20%","설치형"]],
  ["R","직조자의 벽","긴 직선으로 바위를 쏟아 맞은 챔피언을 옆으로 밀어내고(공중) 지형 벽을 만듭니다. 시전 후 재시전하면 벽을 타고 이동하다 도약할 수 있습니다. 벽은 완성 후 4초가 지나면 사라집니다.",["밀어내기","벽","이동"]]],
 chogath:[
  ["P","육식","적을 처치하면 체력과 마나를 회복합니다(포탑 파괴도 포함, 와드는 제외).",["회복"]],
  ["Q","균열","지정 위치에서 잠시 뒤 땅이 솟아올라 적을 1초 띄우고, 이후 60%로 1.5초 둔화시킵니다. 띄우기가 풀려도 둔화는 남습니다.",["띄우기 1초","둔화","범위"]],
  ["W","야수의 비명","원뿔 방향으로 괴성을 질러 피해를 주고 약 1.6~2초 침묵시킵니다.",["침묵","원뿔"]],
  ["E","날카로운 가시","6초 동안 다음 평타 3번이 사거리가 늘고 직선으로 가시를 발사합니다. 맞은 적에게 피해(최대 체력·포식 중첩 비례)와 둔화를 줍니다.",["평타 강화","둔화"]],
  ["R","포식","대상 챔피언을 지정해 먹어 치우며, 포식 대상의 현재 체력이 입히는 확정 피해보다 낮으면 처형됩니다. 처치하면 영구 중첩이 쌓여 체력·크기·사거리가 커집니다(미니언·몬스터는 최대 6중첩).",["처형","영구 성장","대상 지정"]]],
 nocturne:[
  ["P","그림자 칼날","일정 주기마다 다음 평타가 주변 원형으로 퍼져 적들에게 피해를 주고, 맞힌 적 수에 비례해 체력을 회복합니다.",["광역 평타","회복"]],

function powerType(v){

function burstLine(c){
  const b = BURST[c.id]; if(!b) return "";
  return `<div class="bline" title="폭딜 콤보">💥 ${b[0].join("→")}</div>`;
}
function burstSection(c){
  const b = BURST[c.id]; if(!b) return "";
  const keys = ["P","Q","W","E","R"];
  const steps = b[0].map((k,i)=>`<span class="n">${i+1}</span><span class="k ${keys.includes(k)?'':'aa'}">${k}</span>`).join("<i>→</i>");
  return `<section class="burst"><h3>💥 폭딜 콤보</h3>
    <div class="bsteps">${steps}</div>
    <p class="reason" style="margin:6px 0 0">${b[1]}</p></section>`;
}
function miniBars(c){
  const pw = POWER[c.id]; if(!pw) return "";
  return `<div class="mini-wrap" title="초반·중반·후반"><div class="ml"><span>초</span><span>중</span><span>후</span></div><div class="mini">${pw[0].map(v=>`<i style="height:${v*4}px"></i>`).join("")}</div></div>`;
}
function powerSection(c){
  const pw = POWER[c.id]; if(!pw) return "";
  const v = pw[0], [k,label] = powerType(v);
  const X=[50,200,350], Y=x=>110-(x-1)*24;
  const pts = v.map((val,i)=>[X[i],Y(val)]);
  const line = `M${pts[0][0]},${pts[0][1]} C${pts[0][0]+75},${pts[0][1]} ${pts[1][0]-75},${pts[1][1]} ${pts[1][0]},${pts[1][1]} C${pts[1][0]+75},${pts[1][1]} ${pts[2][0]-75},${pts[2][1]} ${pts[2][0]},${pts[2][1]}`;
  const area = line + ` L${pts[2][0]},118 L${pts[0][0]},118 Z`;
  const grid = [1,2,3,4,5].map(n=>`<line x1="20" x2="380" y1="${Y(n)}" y2="${Y(n)}" stroke="#2a3a5e" stroke-dasharray="3 4"/><text x="8" y="${Y(n)+4}" fill="#9aa7bd" font-size="10">${n}</text>`).join("");
  const dots = pts.map((pt,i)=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="6" fill="#0ac8b9" stroke="#0a1428" stroke-width="2"/><text x="${pt[0]}" y="${pt[1]-12}" text-anchor="middle" fill="#e8e6df" font-size="12" font-weight="bold">${v[i]}</text><text x="${pt[0]}" y="146" text-anchor="middle" fill="#c8aa6e" font-size="12" font-weight="bold">${PHASES[i]}</text>`).join("");
  const rows = v.map((val,i)=>`<div class="prow"><span class="lb">${PHASES[i]}</span><span class="pips">${[1,2,3,4,5].map(n=>`<span class="pip ${n<=val?'on':''}"></span>`).join("")}</span><span class="nm">${["매우 약함","약함","보통","강함","매우 강함"][val-1]}</span></div>`).join("");
  return `<section><h3>📈 시기별 강함</h3>
    <span class="pbadge pb-${k}">${label}</span>
    <svg class="power-svg" viewBox="0 0 400 155" role="img" aria-label="${c.name} 시기별 강함 그래프">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ac8b9" stop-opacity=".45"/><stop offset="1" stop-color="#0ac8b9" stop-opacity="0"/></linearGradient></defs>
      ${grid}<path d="${area}" fill="url(#pg)"/><path d="${line}" fill="none" stroke="#0ac8b9" stroke-width="3"/>${dots}
    </svg>
    ${rows}
    <p class="reason" style="margin-top:8px">${pw[1]}</p>
    <p class="plegend">초반=라인전(레벨 1~6) · 중반=핵심 아이템 1~2개 · 후반=풀빌드 한타 / 1(약함)~5(최강). 체감 기준의 참고용입니다.</p>
  </section>`;
}
function initials(c){ return c.name[0]; }
/* 초상화: Riot Data Dragon 이미지. 불러오지 못하면 이름 첫 글자가 보입니다. */
function portrait(c){
  const k = IMG_KEYS[c.id];
  const img = k ? `<img loading="lazy" alt="${c.name}" src="https://ddragon.leagueoflegends.com/cdn/img/champion/loading/${k}_0.jpg" onerror="this.remove()">` : "";
  return `<div class="avatar" style="background:${c.color}">${initials(c)}${img}</div>`;
}
function renderRoles(){
  $("#roles").innerHTML = ROLES.map(r=>`<button class="chip ${r===role?'on':''}" data-r="${r}">${r}</button>`).join("");
  $("#roles").querySelectorAll("button").forEach(b=>b.onclick=()=>{role=b.dataset.r;renderRoles();renderGrid();});
}
function renderGrid(){
  const q = $("#q").value.trim().toLowerCase();
  const list = CHAMPIONS.filter(c=>(role==="전체"||c.role===role) &&
    (!q || c.name.toLowerCase().includes(q) || c.en.toLowerCase().includes(q)));
  if(!list.length){ $("#grid").innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`; return; }
  const groups = ROLES.filter(r=>r!=="전체").map(r=>[r, list.filter(c=>c.role===r)]).filter(g=>g[1].length);
  $("#grid").innerHTML = groups.map(([r,items])=>`
    <div class="grp"><h2>${r}<small>${items.length}명</small></h2>
    <div class="grid">${items.map(c=>`
      <div class="card" data-id="${c.id}">
        ${portrait(c)}
        <b>${c.name}</b><small>${c.en}</small>
        ${patchBadge(c)}
        ${miniBars(c)}
        ${burstLine(c)}
      </div>`).join("")}</div></div>`).join("");
  $("#grid").querySelectorAll(".card").forEach(el=>el.onclick=()=>show(el.dataset.id));
}
function findByName(n){ return CHAMPIONS.find(c=>c.name===n); }
function chips(arr){
  return arr.map(n=>{const c=findByName(n);return `<span class="cn" ${c?`data-go="${c.id}"`:''}>${n}</span>`}).join("");
}
function show(id){
  const c = CHAMPIONS.find(x=>x.id===id); if(!c) return;
  $("#list").style.display="none"; $("#duo").style.display="none"; $("#patch").style.display="none";
  const d = $("#detail"); d.style.display="block";
  d.innerHTML = `
    <button class="back">← 목록으로</button>
    <div class="head">
      ${portrait(c)}
      <div><h2>${c.name} <small style="color:var(--mute);font-size:.9rem">${c.en}</small></h2>
        <div style="color:var(--mute)">${c.title}</div>
        <span class="tag">${c.role}</span><span class="tag">난이도 ${c.diff}</span></div>
    </div>
    ${powerSection(c)}
    ${synergySection(c)}
    ${supAvoidSection(c)}
    ${burstSection(c)}
    <div class="two">
      <section class="weak"><h3>⚠ 상대하기 어려운 챔피언</h3>${chips(c.weak)}</section>
      <section class="strong"><h3>✅ 상대하기 쉬운 챔피언</h3>${chips(c.strong)}</section>
    </div>
    <section><p class="reason" style="margin:0">${c.reason}</p></section>
    <section><h3>💡 플레이 팁</h3><ul>${c.tips.map(t=>`<li>${t}</li>`).join("")}</ul></section>
    <section><h3>🔥 스킬 콤보</h3>
      ${c.combos.map(cb=>`<div class="combo">${cb.map(k=>`<span class="k">${k}</span>`).join("<i>→</i>")}</div>`).join("")}
      <p class="reason">${c.comboNote}</p>
    </section>
    <section><h3>✨ 스킬 설명</h3>
      ${c.skills.map(s=>`<div class="skill"><div class="key">${s[0]}</div><div><b>${s[1]}</b><p>${s[2]}</p>${s[3]?`<div class="stags">${s[3].map(t=>`<span class="stag ${/기절|속박|띄우|넉백|공포|매혹|변이|침묵|둔화|끌어/.test(t)?"cc":""}">${t}</span>`).join("")}</div>`:""}</div></div>`).join("")}
    </section>
    ${patchSection(c)}`;
  d.querySelector(".back").onclick=back;
  d.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>show(el.dataset.go));
  d.querySelectorAll("[data-n]").forEach(el=>el.onclick=()=>{const c=findByName(el.dataset.n);if(c)show(c.id);});
  window.scrollTo(0,0);
}

let enemySup=null, enemyAdc=null;
function renderDuo(){
  const sup = ENEMY_SUP.find(x=>x.id===enemySup), adc = ENEMY_ADC.find(x=>x.id===enemyAdc);
  const opts = (arr,cur,key)=>arr.map(o=>`<button class="eopt ${o.id===cur?'on':''}" data-k="${key}" data-id="${o.id}">${o.label}<small>${o.ex}</small></button>`).join("");
  const score = {};
  [[sup,"서포터"],[adc,"원딜"]].forEach(([cat,who])=>{ if(!cat) return;
    Object.entries(cat.good).forEach(([k,r])=>{ (score[k]=score[k]||{v:0,g:[],b:[]}).v+=2; score[k].g.push([`상대 ${who} ${cat.label}`,r]); });
    Object.entries(cat.bad).forEach(([k,r])=>{ (score[k]=score[k]||{v:0,g:[],b:[]}).v-=2; score[k].b.push([`상대 ${who} ${cat.label}`,r]); });
  });
  const find = k=>DUOS.find(d=>d.adc+"+"+d.sup===k);
  const goods = Object.entries(score).filter(e=>e[1].v>0).sort((x,y)=>y[1].v-x[1].v);
  const bads = Object.entries(score).filter(e=>e[1].v<0).sort((x,y)=>x[1].v-y[1].v);
  const card = ([k,o],cls)=>{ const d=find(k); if(!d) return "";
    const badge = cls==="good" ? (o.v>=4?`<span class="rb s">강력 추천</span>`:`<span class="rb m">추천</span>`) : `<span class="rb x">비추천</span>`;
    const lines = (cls==="good"?o.g:o.b).map(([w,r])=>`<li><b>${w}</b> — ${r}</li>`).join("");
    return `<div class="res ${cls}"><h4><a data-n="${d.adc}">${d.adc}</a> + <a data-n="${d.sup}">${d.sup}</a>${badge}</h4><ul>${lines}</ul>${cls==="good"?`<p class="plan">📋 ${d.plan}</p>`:""}</div>`; };
  let result;
  if(!sup && !adc) result = `<div class="empty">위에서 상대 조합 유형을 선택하면 추천 듀오가 나타납니다.</div>`;
  else result = `
    <h2 class="sec">✅ 이 조합을 뽑으세요${goods.length?`<small style="color:var(--mute);font-size:.8rem"> (${goods.length}개)</small>`:""}</h2>
    ${goods.length?goods.map(e=>card(e,"good")).join(""):`<div class="empty">뚜렷한 추천 조합이 없습니다. 유형을 바꿔 보세요.</div>`}
    ${bads.length?`<h2 class="sec">⛔ 피하는 게 좋은 조합</h2>${bads.map(e=>card(e,"bad")).join("")}`:""}`;
  $("#duo").innerHTML = `
    <h2 class="sec" style="margin-top:6px">🎯 상대 바텀 조합을 선택하세요</h2>
    <p class="ehelp">상대 서포터와 원딜 유형을 고르면 우리 듀오 중 어떤 조합이 유리한지 보여줍니다. 둘 다 고르면 두 조건을 합쳐 계산합니다. (다시 누르면 해제)</p>
    <div class="egroup"><h3>상대 서포터</h3><div class="eopts">${opts(ENEMY_SUP,enemySup,"sup")}</div></div>
    <div class="egroup"><h3>상대 원딜</h3><div class="eopts">${opts(ENEMY_ADC,enemyAdc,"adc")}</div></div>
    ${result}
    <h2 class="sec">📌 상황별 추천 조합</h2>
    ${SITUATIONS.map(x=>`<div class="sit"><b>${x.t}</b><p>${x.d}</p>${x.picks.map(p=>`<span class="pick">${p}</span>`).join("")}</div>`).join("")}`;
  $("#duo").querySelectorAll(".eopt").forEach(b=>b.onclick=()=>{
    if(b.dataset.k==="sup") enemySup = enemySup===b.dataset.id?null:b.dataset.id;
    else enemyAdc = enemyAdc===b.dataset.id?null:b.dataset.id;
    renderDuo();});
  $("#duo").querySelectorAll("[data-n]").forEach(a=>a.onclick=()=>{const c=findByName(a.dataset.n);if(c)show(c.id);});
}
/* 챔피언 상세: 이 챔피언과 시너지 나는 바텀 듀오 */
function synergySection(c){
  const list = DUOS.filter(d=>d.adc===c.name||d.sup===c.name);
  if(!list.length) return "";
  return `<section class="syn"><h3>🤝 시너지 바텀 듀오 <small style="color:var(--mute);font-weight:normal">(${list.length}개)</small></h3>
    <div class="duo-grid">${list.map(d=>`
      <div class="duo">
        <h3><a data-n="${d.adc}">${d.adc}</a><span>+</span><a data-n="${d.sup}">${d.sup}</a></h3>
        <span class="ttag t-${d.type}">${d.type}형</span>
        <dl>
          <dt>💞 시너지</dt><dd>${d.why}</dd>
          <dt>🎯 이럴 때 꺼내세요</dt><dd><ul>${d.when.map(w=>`<li>${w}</li>`).join("")}</ul></dd>
          <dt>📋 라인전 플랜</dt><dd>${d.plan}</dd>
          <dt>⚠ 주의</dt><dd>${d.caution}</dd>
        </dl>
      </div>`).join("")}</div></section>`;
}

function supAvoidSection(c){
  const list = SUP_AVOID[c.id]; if(!list) return "";
  const duosFor = type=>{
    const cat = ENEMY_SUP.find(x=>x.id===type); if(!cat) return [];
    return Object.keys(cat.good).filter(k=>k.split("+").includes(c.name)).slice(0,3);
  };
  const items = list.map(([n,r])=>{
    const type = SUP_TYPE[n]; const cat = ENEMY_SUP.find(x=>x.id===type);
    const d = type ? duosFor(type) : [];
    // 서포터 챔피언 본인 기준일 때는 자기 이름이 들어간 듀오가 나오므로 파트너 표시를 생략
    return `<div class="avi"><b>${n}</b>${cat?`<span class="tp">${cat.label}</span>`:""}<p>${r}</p>${d.length?`<div class="vs">💡 이럴 땐: ${d.join(" / ")}</div>`:""}</div>`;
  }).join("");
  return `<section class="avd"><h3>🚫 이 상대 서포터가 나오면 조심하세요</h3>
    <p class="sub">${c.name} 기준으로 피해야 하거나 라인전이 어려운 상대 서포터입니다.</p>${items}</section>`;
}
function renderPatch(){
  const roles = ["원딜","미드","정글","서포터"];
  const groups = roles.map(r=>{
    const rows = CHAMPIONS.filter(c=>c.role===r && PATCHES[c.id]).flatMap(c=>PATCHES[c.id].map(x=>({c,x})))
      .sort((a,b)=>b.x[0].localeCompare(a.x[0]));
    if(!rows.length) return "";
    return `<h2 class="sec">${r}</h2><section>${rows.map(({c,x})=>`<div class="prow2"><span class="pv">${x[0]}</span><div><b><a data-n="${c.name}" style="color:var(--gold);cursor:pointer">${c.name}</a></b> <span class="pt ${x[1]}">${TYPE_LABEL[x[1]]}</span><p>${x[2]}</p></div></div>`).join("")}</section>`;
  }).join("");
  const none = CHAMPIONS.filter(c=>!PATCHES[c.id]).map(c=>c.name).join(", ");
  $("#patch").innerHTML = `
    <div class="pbase"><b>기준 패치 ${PATCH_BASE}</b> · 26.18~26.22 변경 내역을 반영했습니다. 룰루는 마지막 변경이 25.16입니다. 수치는 패치 노트 요약에서 가져온 것이므로 정확한 값은 공식 패치 노트로 확인하세요.</div>
    <h2 class="sec" style="margin-top:6px">🛠 챔피언 변경</h2>
    ${groups}
    <h2 class="sec">🧰 원딜·서포터 관련 아이템/시스템 변경</h2>
    <section>${SYSTEM_PATCHES.map(x=>`<div class="prow2"><span class="pv">${x.p}</span><div><b>${x.n}</b> <span class="pt ${x.t}">${TYPE_LABEL[x.t]}</span><p>${x.x}</p></div></div>`).join("")}</section>
    <h2 class="sec">변경 없음 (26.18~26.22)</h2>
    <p class="reason">${none}</p>`;
  $("#patch").querySelectorAll("[data-n]").forEach(a=>a.onclick=()=>{const c=findByName(a.dataset.n);if(c)show(c.id);});
}
function setTab(t){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("#detail").style.display="none";
  ["list","duo","patch"].forEach(n=>$("#"+n).style.display = n===t ? "block" : "none");
  if(t==="duo") renderDuo();
  if(t==="patch") renderPatch();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.t));

$("#q").addEventListener("input", renderGrid);
renderRoles(); renderGrid();
